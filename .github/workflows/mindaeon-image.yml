# Mindaeon's Gitea image: rebuilt and published from every push to a mindaeon/* release
# branch, by the same script a workstation uses (.mindaeon/build-image.sh). Every action and
# image is pinned by digest. The image goes to ghcr.io/mindaeon/gitea as
# <version from .mindaeon/version> (never moved once published) and sha-<commit>; its SBOMs go
# to the release v<version>.
#
# The image is built from the commit that set .mindaeon/version, not from the branch's head: a
# later commit that changes only .github/ (this file) publishes nothing new, and the rebuild of
# the version's commit reproduces its digest or fails. A later commit that changes anything
# else without raising .mindaeon/version fails here.
#
# Pushing to ghcr.io uses this run's own GITHUB_TOKEN with packages: write. The repository has
# Write in the package's "Manage Actions access" list (set in the package's settings; GitHub has
# no API for it), so no long-lived personal token is kept. The job runs only on a push to this
# repository, in the `release` environment (which only mindaeon/* branches and v*-mindaeon.*
# tags may deploy to), never for a pull request or a fork.
name: mindaeon-image

on:
  push:
    branches:
      - "mindaeon/*"

permissions:
  contents: read

concurrency:
  group: mindaeon-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'mindaeon/gitea' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 120
    permissions:
      contents: write # the release that carries the SBOMs
      packages: write # ghcr.io/mindaeon/gitea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # to find the commit that set .mindaeon/version
      - name: Find the version's commit
        id: source
        run: |
          commit=$(git log -1 --format=%H -- .mindaeon/version)
          if ! git diff --quiet "$commit" HEAD -- . ':(exclude).github'; then
            echo "files outside .github/ changed after $commit set .mindaeon/version: raise .mindaeon/version" >&2
            git diff --stat "$commit" HEAD -- . ':(exclude).github' >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: mindaeon-reproducible
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft 1.52.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/syft.tar.gz" https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install crane 0.22.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tar.gz" https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
      - name: Build and publish
        env:
          MINDAEON_OUT: ${{ runner.temp }}/out
          COMMIT: ${{ steps.source.outputs.commit }}
        run: .mindaeon/build-image.sh --push "$COMMIT"
      - name: Publish the SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ${{ runner.temp }}/out
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          version=$(cat .mindaeon/version)
          image=$(cat "$OUT/image")
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" --target "$COMMIT" --title "Gitea $version" \
              --notes "Mindaeon's Gitea, built from $COMMIT on $GITHUB_REF_NAME: \`$image\`."
          fi
          gh release upload "v$version" --clobber "$OUT"/*.spdx.json
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
